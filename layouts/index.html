<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elias Colli</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      background:#1e293b;
      padding:40px;
      border-radius:20px;
      text-align:center;
      width:400px;
      box-shadow:0 0 20px rgba(0,0,0,.4);
    }

    img{
      width:140px;
      height:140px;
      border-radius:50%;
      object-fit:cover;
      margin-bottom:20px;
      border:4px solid #38bdf8;
    }

    h1{
      margin:0;
      font-size:32px;
    }

    p{
      color:#cbd5e1;
      margin-top:10px;
      line-height:1.6;
    }

    .buttons{
      margin-top:25px;
      display:flex;
      gap:15px;
      justify-content:center;
    }

    a{
      text-decoration:none;
      background:#38bdf8;
      color:black;
      padding:10px 18px;
      border-radius:10px;
      font-weight:bold;
      transition:.3s;
    }

    a:hover{
      transform:scale(1.05);
    }
  </style>
</head>

<body>

  <div class="card">

    <img src="/assets/img/profile.jpg" alt="profile">

    <h1>Elias Colli</h1>

    <p>
      Estudiante de Ingeniería en Desarrollo y Gestión de Software.
      Apasionado por el desarrollo web y las nuevas tecnologías.
    </p>

    <div class="buttons">
      <a href="https://github.com/EliasColli">GitHub</a>
      <a href="mailto:bautistacollicarloselias@gmail.com">Email</a>
    </div>

  </div>

</body>
</html>
